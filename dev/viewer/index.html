<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GUI snapshot</title>
  <script src="snapshot.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b2430;
      --muted: #5d6b7c;
      --line: #d7dee7;
      --paper: #eef2f6;
      --card: #ffffff;
      --accent: #1d6fbf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    header { padding: 28px 32px 4px; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }
    .meta { margin: 0; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(280px, 1fr);
      gap: 20px;
      padding: 16px 32px 48px;
    }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stage {
      position: relative;
      background: #f7f9fb;
      border-radius: 8px;
      overflow: hidden;
    }
    .frame {
      position: absolute;
      border: 1px solid rgba(27, 36, 48, 0.28);
      border-radius: 3px;
      cursor: pointer;
    }
    .frame.leaf {
      background: rgba(29, 111, 191, 0.1);
      border-color: rgba(29, 111, 191, 0.55);
    }
    .frame span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 3px;
      color: var(--ink);
      font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .node { padding: 10px 0; border-top: 1px solid var(--line); }
    .node:first-of-type { border-top: 0; padding-top: 0; }
    .copy-title {
      margin: 0 0 2px;
      font-weight: 650;
    }
    .role {
      margin: 0 0 4px;
      color: var(--muted);
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 2px 0; overflow-wrap: anywhere; }
    .empty { margin: 0; color: var(--muted); }
    .toolbar { display: flex; gap: 12px; align-items: center; margin: 12px 0 0; flex-wrap: wrap; }
    button, select {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 12px;
      font: 14px/1.2 ui-sans-serif, system-ui, sans-serif;
    }
    button { cursor: pointer; }
    select { max-width: 240px; }
    button:hover { border-color: var(--accent); }
    #listener.connected { color: #1b7f4a; }
    #listener.disconnected { color: #a15c12; }
    @media (max-width: 860px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>GUI snapshot</h1>
    <p class="meta" id="meta">Loading snapshot…</p>
    <div class="toolbar">
      <select id="app" aria-label="App"></select>
      <button id="register" type="button">注册</button>
      <button id="refresh" type="button">刷新</button>
      <p class="meta disconnected" id="listener">Listener disconnected</p>
    </div>
  </header>
  <main>
    <section>
      <h2>Layout</h2>
      <div class="stage" id="stage"></div>
    </section>
    <section>
      <h2 id="copy-heading">Copy</h2>
      <div id="copy"></div>
    </section>
  </main>
  <script>
    (function () {
      var pageURL = "http://127.0.0.1:47653/";
      var sameOrigin = location.hostname === "127.0.0.1" && String(location.port) === "47653";
      var broker = sameOrigin ? "" : "http://127.0.0.1:47653";
      var meta = document.getElementById("meta");
      var stage = document.getElementById("stage");
      var copy = document.getElementById("copy");
      var copyHeading = document.getElementById("copy-heading");
      var listener = document.getElementById("listener");
      var appSelect = document.getElementById("app");
      var source = null;
      var offlineMessage = "Open " + pageURL + " to use this page.";
      var registerMessage = "Choose an app and press 注册.";

      var roleWords = {
        "application": 1,
        "standard window": 1,
        "group": 1,
        "text": 1,
        "button": 1,
        "switch": 1,
        "image": 1,
        "checkbox": 1,
        "radio button": 1,
        "menu item": 1,
        "menu": 1,
        "menu bar": 1,
        "menu bar item": 1,
        "cell": 1,
        "outline row": 1,
        "scroll area": 1,
        "list": 1,
        "heading": 1,
        "link": 1,
        "pop up button": 1,
        "menu button": 1,
        "close button": 1,
        "zoom button": 1,
        "minimize button": 1,
        "toolbar": 1,
        "tab group": 1,
        "unknown": 1
      };

      var fillerWords = {
        "telephone": 1,
        "text field": 1,
        "html content": 1,
        "content list": 1,
        "unlabeled image": 1,
        "to get missing image descriptions, open the context menu.": 1,
        "this button also has an action to zoom the window": 1,
        "full screen button": 1
      };

      function isRoleText(text) {
        return roleWords[String(text || "").trim().toLowerCase()] === 1;
      }

      function isChromeLine(line) {
        if (!line || isRoleText(line) || line.indexOf("_NS:") === 0) return true;
        var lower = line.toLowerCase();
        if (fillerWords[lower]) return true;
        if (/\.(webp|png|jpe?g|gif|svg)$/i.test(line)) return true;
        if (/view$/i.test(line) && line.indexOf(" ") < 0) return true;
        return false;
      }

      function visibleLines(node) {
        var lines = [];
        (node.texts || []).forEach(function (text) {
          String(text).split(/\r?\n/).forEach(function (part) {
            var line = part.trim();
            if (isChromeLine(line)) return;
            if (lines.indexOf(line) < 0) lines.push(line);
          });
        });
        return lines;
      }

      function frameLabel(lines) {
        for (var i = 0; i < lines.length; i++) {
          if (lines[i] !== "0" && lines[i] !== "1") return lines[i];
        }
        return lines.length ? lines[0] : "";
      }

      function say(text) {
        var p = document.createElement("p");
        p.className = "empty";
        p.textContent = text;
        return p;
      }

      function render(snap) {
        stage.textContent = "";
        copy.textContent = "";
        if (!snap || !snap.tree) {
          meta.textContent = "No snapshot loaded.";
          stage.appendChild(say("No frames yet."));
          copy.appendChild(say("No copy yet."));
          copyHeading.textContent = "Copy";
          return;
        }

        var nodes = [];
        function walk(node) {
          nodes.push(node);
          (node.children || []).forEach(walk);
        }
        walk(snap.tree);

        var seenLines = [];
        nodes.forEach(function (node) {
          visibleLines(node).forEach(function (line) {
            if (seenLines.indexOf(line) < 0) seenLines.push(line);
          });
        });
        meta.textContent = (snap.app || "Unknown app") + " · " + (snap.capturedAt || "unknown time")
          + " · " + nodes.length + " nodes · " + seenLines.length + " strings";

        function usable(frame) {
          return frame && frame.width > 1 && frame.height > 1
            && frame.x > -2000 && frame.y > -2000
            && frame.x < 10000 && frame.y < 10000
            && frame.width < 5000 && frame.height < 5000;
        }
        var usableNodes = nodes.filter(function (node) { return usable(node.frame); });
        var focus = null;
        var focusArea = 0;
        usableNodes.forEach(function (node) {
          var frame = node.frame;
          if (frame.width >= 900 || frame.height >= 900) return;
          var area = frame.width * frame.height;
          if (area > focusArea) {
            focus = node;
            focusArea = area;
          }
        });
        var focused = [];
        (function collect(node) {
          focused.push(node);
          (node.children || []).forEach(collect);
        })(focus || snap.tree);
        var boxes = focused.filter(function (node) { return usable(node.frame); });

        if (!boxes.length) {
          stage.appendChild(say("The snapshot has no sized frames."));
        } else {
          var minX = Infinity;
          var minY = Infinity;
          var maxX = -Infinity;
          var maxY = -Infinity;
          boxes.forEach(function (node) {
            var frame = node.frame;
            minX = Math.min(minX, frame.x);
            minY = Math.min(minY, frame.y);
            maxX = Math.max(maxX, frame.x + frame.width);
            maxY = Math.max(maxY, frame.y + frame.height);
          });
          var boundsW = Math.max(1, maxX - minX);
          var boundsH = Math.max(1, maxY - minY);
          var maxW = Math.min(400, stage.parentElement.clientWidth - 32);
          if (!(maxW > 80)) maxW = 360;
          var scale = Math.min(maxW / boundsW, 520 / boundsH);
          stage.style.width = Math.ceil(boundsW * scale) + "px";
          stage.style.height = Math.ceil(boundsH * scale) + "px";

          boxes.forEach(function (node) {
            var frame = node.frame;
            var el = document.createElement("div");
            el.className = "frame";
            var width = Math.max(1, frame.width * scale);
            var height = Math.max(1, frame.height * scale);
            el.style.left = ((frame.x - minX) * scale) + "px";
            el.style.top = ((frame.y - minY) * scale) + "px";
            el.style.width = width + "px";
            el.style.height = height + "px";
            var leaf = !node.children || !node.children.length;
            if (leaf) el.className += " leaf";
            var label = leaf ? frameLabel(visibleLines(node)) : "";
            if (label && width >= 14 && height >= 12) {
              var span = document.createElement("span");
              span.textContent = label;
              el.appendChild(span);
            }
            if (node.id) {
              el.addEventListener("click", function (event) {
                event.stopPropagation();
                fetch(broker + "/perform", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ action: "click", nodeId: node.id })
                }).then(function (response) {
                  if (response.status === 409) {
                    meta.textContent = registerMessage;
                    return;
                  }
                  if (!response.ok) throw new Error("perform failed");
                }).catch(offline);
              });
            }
            stage.appendChild(el);
          });
        }

        var shown = 0;
        nodes.forEach(function (node) {
          var lines = visibleLines(node);
          if (!lines.length) return;
          shown += 1;
          var card = document.createElement("article");
          card.className = "node";
          var title = document.createElement("p");
          title.className = "copy-title";
          title.textContent = lines[0];
          var role = document.createElement("p");
          role.className = "role";
          var frame = node.frame || { x: 0, y: 0, width: 0, height: 0 };
          role.textContent = Math.round(frame.x) + "," + Math.round(frame.y)
            + " " + Math.round(frame.width) + "×" + Math.round(frame.height);
          card.appendChild(title);
          card.appendChild(role);
          if (lines.length > 1) {
            var list = document.createElement("ul");
            lines.slice(1).forEach(function (text) {
              var item = document.createElement("li");
              item.textContent = text;
              list.appendChild(item);
            });
            card.appendChild(list);
          }
          copy.appendChild(card);
        });
        copyHeading.textContent = "Copy · " + shown + " controls";
        if (!shown) copy.appendChild(say("No text was read."));
      }

      render(window.SNAPSHOT);

      function offline(error) {
        meta.textContent = error && error.name === "TypeError" ? offlineMessage : registerMessage;
      }

      function fillApps(body) {
        var previous = appSelect.value;
        appSelect.textContent = "";
        (body.apps || []).forEach(function (app) {
          var option = document.createElement("option");
          option.value = app.id;
          option.textContent = app.name || app.id;
          appSelect.appendChild(option);
        });
        if (previous) appSelect.value = previous;
        if (!appSelect.value) {
          for (var i = 0; i < appSelect.options.length; i++) {
            if (appSelect.options[i].value === "calculator") {
              appSelect.selectedIndex = i;
              break;
            }
          }
        }
      }

      function openListener() {
        if (source) source.close();
        source = new EventSource(broker + "/events?listener=viewer");
        source.onopen = function () {
          listener.textContent = "Listener connected";
          listener.className = "meta connected";
        };
        source.onerror = function () {
          listener.textContent = "Listener disconnected";
          listener.className = "meta disconnected";
        };
        source.addEventListener("gui.changed", function (event) {
          var message = JSON.parse(event.data);
          render(message.payload);
        });
      }

      function refresh() {
        return fetch(broker + "/snapshot").then(function (response) {
          if (response.status === 409) {
            meta.textContent = registerMessage;
            return null;
          }
          if (!response.ok) throw new Error("refresh failed");
          return response.json();
        }).then(function (snap) {
          if (snap) render(snap);
        }).catch(offline);
      }

      document.getElementById("refresh").addEventListener("click", refresh);

      document.getElementById("register").addEventListener("click", function () {
        var target = appSelect.value;
        if (!target) {
          meta.textContent = registerMessage;
          return;
        }
        fetch(broker + "/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            steps: [{
              id: "attach-gui-reader",
              action: "attachPlugin",
              capability: "gui.read",
              targetApp: target
            }],
            listener: {
              operation: "register",
              listener: "viewer",
              subjects: ["gui.changed"]
            }
          })
        }).then(function (response) {
          if (!response.ok) throw new Error("register failed");
          return response.json();
        }).then(function () {
          openListener();
          return refresh();
        }).catch(offline);
      });

      fetch(broker + "/apps").then(function (response) {
        if (!response.ok) throw new Error("apps failed");
        return response.json();
      }).then(fillApps).catch(function (error) {
        meta.textContent = error && error.name === "TypeError" ? offlineMessage : registerMessage;
      });
    }());
  </script>
</body>
</html>
